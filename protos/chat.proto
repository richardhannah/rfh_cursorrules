syntax = "proto3";

package chat;

option go_package = "chat";

message ChatMessage {
  int32 id = 1;
  string username = 2;
  string message = 3;
  // Unix timestamp (seconds since epoch)
  int64 created_at = 4;
}

message Empty {}

service ChatService {
  // Streams new messages to the client as they are broadcast
  rpc StreamMessages(Empty) returns (stream ChatMessage);
  // Sends a new message; the server returns the stored message (with timestamp, etc.)
  rpc SendMessage(ChatMessage) returns (ChatMessage);
}
